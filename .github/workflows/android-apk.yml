name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk seen-and-gone.apk

      - name: Check the APK exists
        run: ls -lh seen-and-gone.apk

      - name: Publish the APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view apk-latest >/dev/null 2>&1; then
            gh release create apk-latest \
              --title "Seen & Gone — Android APK" \
              --notes "Install this on Android: download the APK, open it and allow installing from this source. It is built automatically from the latest code in this repository."
          fi
          gh release upload apk-latest seen-and-gone.apk --clobber
          echo "Download: $(gh release view apk-latest --json url -q .url)"
